name: android-ci

on:
  push:
    paths:
      - "android/**"
      - "protocol/**"
      - "ci/**"
      - ".github/workflows/android-ci.yml"
      - "scripts/enable-ci.sh"
      - "scripts/ci-run.sh"
  pull_request:
    paths:
      - "android/**"
      - "protocol/**"
      - "ci/**"
      - ".github/workflows/android-ci.yml"
      - "scripts/enable-ci.sh"
      - "scripts/ci-run.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow copies
        run: ./scripts/enable-ci.sh --check

      # Current command-line SDK tools can require a newer JVM than the app.
      # Use the hosted runner's SDK instead of bootstrapping deprecated tools.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-license-responses"
          ./scripts/ci-run.sh "$SDKMANAGER" --licenses < "$RUNNER_TEMP/android-license-responses"
          ./scripts/ci-run.sh "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Select Java 17 for the app build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, and debug APK
        working-directory: android
        run: ../scripts/ci-run.sh ./gradlew --no-daemon --console=plain --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Verify signature and package the hardware-test build
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/app-debug.apk
          git archive --format=tar.gz --prefix=UbuDesk/ -o artifacts/ubudesk-test-source.tar.gz HEAD
          cp docs/QUICK_TEST.md artifacts/README-testing.md
          (
            cd artifacts
            sha256sum app-debug.apk ubudesk-test-source.tar.gz > SHA256SUMS
          )
          {
            printf 'UbuDesk debug build (development/testing only)\n'
            printf 'Commit: %s\nRef: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME"
            printf 'Build: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Requires Android 8.0 (API 26) or newer.\n'
            printf 'The source archive matches this APK. See README-testing.md.\n'
          } > artifacts/build-info.txt

      - name: Upload hardware-test build
        uses: actions/upload-artifact@v4
        with:
          name: ubudesk-debug-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
