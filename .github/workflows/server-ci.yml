name: server-ci

on:
  push:
    paths:
      - "server/**"
      - "protocol/**"
      - "tools/**"
      - "ci/**"
      - ".github/workflows/server-ci.yml"
      - "scripts/enable-ci.sh"
  pull_request:
    paths:
      - "server/**"
      - "protocol/**"
      - "tools/**"
      - "ci/**"
      - ".github/workflows/server-ci.yml"
      - "scripts/enable-ci.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow copies
        run: ./scripts/enable-ci.sh --check

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Set up venv (headless; PyAV wheels include the test encoder)
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Ruff lint and format
        working-directory: server
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Mypy
        working-directory: server
        run: .venv/bin/mypy ubudesk_server

      - name: Verify golden vectors
        run: |
          server/.venv/bin/python protocol/vectors/generate.py
          test -z "$(git status --porcelain -- protocol/vectors/)"

      - name: Pytest (unit and headless integration)
        working-directory: server
        run: .venv/bin/python -m pytest tests -v --junitxml=reports/pytest.xml

      - name: End-to-end CLI smoke test
        shell: bash
        run: |
          export UBUDESK_STATE_DIR="$RUNNER_TEMP/ubudesk-ci"
          LOG="$RUNNER_TEMP/ubudesk-serve.log"
          DUMP="$RUNNER_TEMP/ubudesk-smoke.h264"
          server/.venv/bin/ubudesk serve --source test --no-tls --bind 127.0.0.1 --pair > "$LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          # Bound startup and notice early exits rather than assuming a fixed sleep.
          for attempt in {1..50}; do
            kill -0 "$SERVER_PID" || { cat "$LOG"; exit 1; }
            if grep -q 'pairing PIN:' "$LOG"; then break; fi
            sleep 0.2
          done
          PIN=$(sed -nE 's/.*pairing PIN: ([0-9]{6}).*/\1/p' "$LOG" | head -1)
          test -n "$PIN"
          echo "::add-mask::$PIN"
          server/.venv/bin/python tools/test_client.py \
            --host 127.0.0.1 --no-tls --pin "$PIN" \
            --seconds 5 --request-idr --touch --dump "$DUMP" > "$RUNNER_TEMP/ubudesk-smoke.json"
          # Decode the actual dump, not just check that a nonempty file exists.
          DUMP="$DUMP" server/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          import av

          stats = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ubudesk-smoke.json").read_text())
          stats.pop("token", None)
          print(json.dumps(stats))
          assert stats["frames"] >= 30, stats
          assert stats["first_frame_key"] and stats["first_frame_has_config"], stats
          assert stats["idr_latency_s"] is not None and stats["idr_latency_s"] < 3, stats
          with av.open(os.environ["DUMP"], format="h264") as video:
              decoded = sum(1 for _ in video.decode(video=0))
          assert decoded >= 30, decoded
          print(f"Decoded {decoded} H.264 frames successfully")
          PY

      - name: Upload server test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-reports-${{ matrix.os }}-${{ github.sha }}
          path: server/reports/
          if-no-files-found: ignore
          retention-days: 14
